name: test-package-config

on:
  workflow_dispatch:
    inputs:
      testconfig:
        description: testconfig file to use
        type: choice
        options:
          - sample
        default: sample

permissions:
  contents: read

concurrency:
  group: test-package-config-${{ inputs.testconfig }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: true

      - uses: ./.github/self-actions/prepare-openwrt-source
        with:
          mode: config-only
          scenario-files: .github/self-configs/testconfig/${{ inputs.testconfig }}

      - name: Show feeds result
        run: cat feeds.conf.default

      - uses: actions/upload-artifact@v4
        with:
          name: package-probe-${{ inputs.testconfig }}
          path: ./.config
          retention-days: 90
          if-no-files-found: ignore
          overwrite: true
